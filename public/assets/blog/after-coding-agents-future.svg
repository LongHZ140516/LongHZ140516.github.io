<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title description" shape-rendering="geometricPrecision">
  <title id="title">Coding Agent 连接创作意图与可交互三维世界</title>
  <desc id="description">创作者用自然语言表达意图，Coding Agent 结合代码生成、空间理解和工具使用能力，完成建模、材质、特效、动画与生成模型协作，最终构建可探索、可交互、可迭代的游戏世界。</desc>
