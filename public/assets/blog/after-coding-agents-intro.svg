    <path d="m928 198 84-49v100l-84 49z" fill="#eeeae1"/>
    <path d="m998 238 58-33 58 33-59 34z" fill="#171614"/>
    <path d="m998 238 57 34v70l-57-33z" fill="#934028"/>
