<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title description" shape-rendering="geometricPrecision">
  <title id="title">世界模型与 Coding Agent 正在改变 3D 创作</title>
  <desc id="description">世界模型受到算力、成本和产品化约束，Coding Agent 则通过代码和工具走向一个可编辑的三维游戏世界。</desc>
  <defs>
    <marker id="arrow-intro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#171614"/>
    </marker>
    <clipPath id="intro-plane-clip">
      <path d="m620 205 218-126 298 168-220 51z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="300" fill="#eeeae1"/>
  <rect x="1" y="1" width="1198" height="298" fill="#faf8f2" stroke="#171614" stroke-width="2"/>
  <rect x="20" y="20" width="9" height="260" fill="#c6613f"/>

  <g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
    <text x="50" y="40" fill="#934028" font-size="19" font-weight="700">世界模型</text>
    <text x="50" y="64" fill="#6f6a62" font-size="16">生成连续、可信的画面</text>

    <g stroke="#171614" stroke-width="2">
      <rect x="54" y="98" width="104" height="62" fill="#eeeae1"/>
      <rect x="67" y="88" width="104" height="62" fill="#e5b09c"/>
      <rect x="80" y="78" width="104" height="62" fill="#faf8f2"/>
      <path d="m98 122 25-24 19 16 26-23" fill="none"/>
      <circle cx="106" cy="96" r="6" fill="#c6613f"/>
    </g>
    <path d="M202 110h60" fill="none" stroke="#171614" stroke-width="3" marker-end="url(#arrow-intro)"/>

    <rect x="278" y="62" width="222" height="108" fill="#171614"/>
    <text x="300" y="94" fill="#faf8f2" font-size="17" font-weight="700">现实边界</text>
    <path d="M300 108h178" stroke="#6f6a62" stroke-width="1"/>
    <text x="300" y="134" fill="#eeeae1" font-size="16">算力与生成成本</text>
    <text x="300" y="158" fill="#eeeae1" font-size="16">产品形态与商业模式</text>

    <text x="50" y="205" fill="#934028" font-size="19" font-weight="700">Coding Agent</text>
    <text x="50" y="229" fill="#6f6a62" font-size="16">调用代码与工具</text>
    <rect x="184" y="184" width="132" height="56" fill="#faf8f2" stroke="#171614" stroke-width="2"/>
    <path d="M202 201h52M202 212h82M202 223h45" stroke="#171614" stroke-width="5"/>
    <circle cx="350" cy="212" r="25" fill="#c6613f" stroke="#171614" stroke-width="2"/>
    <rect x="343" y="205" width="14" height="14" fill="#faf8f2" stroke="#171614" stroke-width="2"/>
    <path d="M375 212h238" fill="none" stroke="#171614" stroke-width="3" marker-end="url(#arrow-intro)"/>
    <text x="184" y="270" fill="#6f6a62" font-size="16">把想法变成可操作、可编辑的结果</text>

    <rect x="620" y="27" width="8" height="54" fill="#c6613f"/>
    <text x="648" y="48" fill="#171614" font-size="20" font-weight="700">我仍然想亲手创造</text>
    <text x="648" y="75" fill="#171614" font-size="20" font-weight="700">一个属于自己的游戏世界</text>
    <text x="648" y="101" fill="#6f6a62" font-size="14">从想法到可运行世界</text>
  </g>

  <g stroke="#171614" stroke-width="2" stroke-linejoin="miter">
    <circle cx="1030" cy="126" r="93" fill="#c6613f" stroke="#934028"/>
    <path d="m620 205 218-126 298 168-220 51z" fill="#faf8f2"/>
    <g fill="none" stroke="#a49d91" stroke-width="1.5" clip-path="url(#intro-plane-clip)">
      <path d="m676 219 218-126M733 235 951 109M790 250l218-126M848 266l216-125"/>
      <path d="m675 173 299 168M730 141l299 168M785 110l299 168"/>
    </g>
    <path d="m842 112 74-43 74 42-75 44z" fill="#faf8f2"/>
    <path d="m842 112 73 43v85l-73-42z" fill="#e5b09c"/>
    <path d="m915 155 75-44v85l-75 44z" fill="#eeeae1"/>
    <path d="m1030 184 55-32 56 32-56 33z" fill="#171614"/>
    <path d="m1030 184 55 33v62l-55-32z" fill="#934028"/>
    <path d="m1085 217 56-33v62l-56 33z" fill="#c6613f"/>
  </g>
</svg>
