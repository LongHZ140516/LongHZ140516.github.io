      <rect x="70" y="151" width="108" height="68" fill="#e5b09c"/>
      <rect x="86" y="140" width="108" height="68" fill="#faf8f2"/>
      <path d="m104 188 28-26 19 16 24-21" fill="none"/>
      <circle cx="113" cy="161" r="7" fill="#c6613f"/>
    </g>
    <path d="M210 174h92" stroke="#171614" stroke-width="3"/>
    <path d="m292 164 14 10-14 10z" fill="#171614"/>

    <rect x="316" y="118" width="190" height="116" fill="#171614"/>
    <text x="338" y="150" fill="#faf8f2" font-size="17" font-weight="700">现实边界</text>
    <path d="M338 164h146" stroke="#6f6a62" stroke-width="1"/>
    <text x="338" y="190" fill="#eeeae1" font-size="16">算力与生成成本</text>
    <text x="338" y="216" fill="#eeeae1" font-size="16">产品形态与商业模式</text>

    <text x="50" y="268" fill="#934028" font-size="19" font-weight="700">Coding Agent</text>
    <rect x="178" y="244" width="120" height="52" fill="#faf8f2" stroke="#171614" stroke-width="2"/>
    <path d="M194 260h54M194 270h78M194 280h42" stroke="#171614" stroke-width="5"/>
    <circle cx="322" cy="270" r="24" fill="#c6613f" stroke="#171614" stroke-width="2"/>
    <rect x="315" y="263" width="14" height="14" fill="#faf8f2" stroke="#171614" stroke-width="2"/>
    <path d="M346 270h218" stroke="#171614" stroke-width="3"/>
    <path d="m554 260 14 10-14 10z" fill="#171614"/>
    <text x="178" y="320" fill="#6f6a62" font-size="16">调用代码与工具，把想法变成可操作的结果</text>
  </g>

  <g transform="translate(-120 -40)" stroke="#171614" stroke-width="2" stroke-linejoin="miter">
    <circle cx="966" cy="190" r="112" fill="#c6613f" stroke="#934028"/>
