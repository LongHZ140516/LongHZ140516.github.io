    <text x="1140" y="77" fill="#6f6a62" font-size="16" text-anchor="end">落地</text>
  </g>

  <g stroke="#171614" stroke-width="2" stroke-linejoin="miter">
    <circle cx="1060" cy="139" r="64" fill="#c6613f" stroke="#934028"/>
    <path d="M850 190 961 126 1144 229 1032 245z" fill="#faf8f2"/>
    <g fill="none" stroke="#a49d91" stroke-width="1.5">
      <path d="m880 207 110-64M911 224l110-64M942 242l110-64"/>
      <path d="m892 166 140 79M930 144l183 103M968 122l183 103"/>
    </g>
    <path d="m976 131 55-32 55 31-55 32z" fill="#faf8f2"/>
    <path d="m976 131 55 31v65l-55-31z" fill="#e5b09c"/>
    <path d="m1031 162 55-32v65l-55 32z" fill="#eeeae1"/>
    <path d="m1084 191 39-23 39 23-39 23z" fill="#171614"/>
    <path d="m1084 191 39 23v30l-39-23z" fill="#934028"/>
    <path d="m1123 214 39-23v30l-39 23z" fill="#c6613f"/>
  </g>

  <g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="15" font-weight="700">
    <rect x="835" y="214" width="74" height="26" fill="#171614"/>
    <rect x="917" y="214" width="74" height="26" fill="#934028"/>
    <rect x="999" y="214" width="88" height="26" fill="#e5b09c" stroke="#171614" stroke-width="1"/>
    <text x="872" y="232" fill="#faf8f2" text-anchor="middle">稳定</text>
    <text x="954" y="232" fill="#faf8f2" text-anchor="middle">可控</text>
    <text x="1043" y="232" fill="#171614" text-anchor="middle">可维护</text>
  </g>
</svg>
