<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title description" shape-rendering="geometricPrecision">
  <title id="title">生成模型与 PCG 共同构建三维世界</title>
  <desc id="description">生成模型创造贴图、资产和材质，程序化内容生成组织地形、资产散布与材质混合，LLM 通过代码将两种能力连接成稳定、可控、可维护的三维世界。</desc>
  <defs>
    <marker id="arrow-process" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#171614"/>
    </marker>
  </defs>

  <rect width="1200" height="280" fill="#eeeae1"/>
  <rect x="1" y="1" width="1198" height="278" fill="#faf8f2" stroke="#171614" stroke-width="2"/>

  <g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
    <rect x="35" y="34" width="255" height="212" fill="#faf8f2" stroke="#171614" stroke-width="2"/>
    <rect x="35" y="34" width="255" height="11" fill="#c6613f"/>
    <text x="55" y="77" fill="#934028" font-size="20" font-weight="700">生成模型</text>
    <text x="266" y="77" fill="#6f6a62" font-size="16" text-anchor="end">创造</text>
    <g font-size="17" fill="#171614">
      <rect x="55" y="98" width="68" height="48" fill="#e5b09c" stroke="#171614" stroke-width="1.5"/>
      <rect x="129" y="98" width="68" height="48" fill="#eeeae1" stroke="#171614" stroke-width="1.5"/>
      <rect x="203" y="98" width="68" height="48" fill="#171614"/>
      <text x="89" y="128" text-anchor="middle">贴图</text>
      <text x="163" y="128" text-anchor="middle">资产</text>
      <text x="237" y="128" fill="#faf8f2" text-anchor="middle">材质</text>
    </g>
    <path d="M55 177h104M55 200h184M55 223h142" stroke="#171614" stroke-width="6"/>

    <rect x="330" y="34" width="295" height="212" fill="#eeeae1" stroke="#171614" stroke-width="2"/>
    <rect x="330" y="34" width="295" height="11" fill="#171614"/>
    <text x="350" y="77" fill="#171614" font-size="20" font-weight="700">传统 PCG</text>
    <text x="600" y="77" fill="#6f6a62" font-size="16" text-anchor="end">组织</text>
    <text x="350" y="111" fill="#6f6a62" font-size="15">噪声地形</text>
    <g fill="none" stroke="#171614" stroke-width="2">
      <path d="M350 153c29-46 58 43 91-5s63 29 94-19 54 14 70-4"/>
      <path d="M350 169c29-46 58 43 91-5s63 29 94-19 54 14 70-4" stroke="#c6613f"/>
      <circle cx="368" cy="202" r="5" fill="#934028"/>
      <circle cx="405" cy="217" r="7" fill="#c6613f"/>
      <circle cx="449" cy="198" r="4" fill="#171614"/>
      <circle cx="489" cy="226" r="6" fill="#934028"/>
      <circle cx="544" cy="204" r="5" fill="#171614"/>
      <circle cx="585" cy="220" r="7" fill="#c6613f"/>
    </g>
    <text x="350" y="238" fill="#6f6a62" font-size="15">资产散布与 Splat Map</text>
  </g>

  <path d="M290 140h38" fill="none" stroke="#171614" stroke-width="3" marker-end="url(#arrow-process)"/>
  <path d="M625 140h45" fill="none" stroke="#171614" stroke-width="3" marker-end="url(#arrow-process)"/>
  <rect x="674" y="94" width="92" height="92" fill="#171614" transform="rotate(45 720 140)"/>
  <rect x="701" y="121" width="38" height="38" fill="#faf8f2" stroke="#c6613f" stroke-width="6"/>
  <path d="M770 140h43" fill="none" stroke="#171614" stroke-width="3" marker-end="url(#arrow-process)"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" text-anchor="middle">
    <text x="720" y="223" fill="#171614" font-size="16" font-weight="700">LLM 通过代码连接</text>
    <text x="720" y="244" fill="#6f6a62" font-size="14">生成能力与程序化方法</text>
  </g>

  <g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
    <rect x="815" y="34" width="350" height="212" fill="#faf8f2" stroke="#171614" stroke-width="2"/>
    <rect x="815" y="34" width="350" height="11" fill="#c6613f"/>
